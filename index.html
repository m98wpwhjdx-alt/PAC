<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPAC Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
      --bg: #08090c;
      --card: #11131a;
      --card-hover: #171a24;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f4f6fb;
      --muted: rgba(244, 246, 251, 0.72);
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(95, 112, 255, 0.16), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px;
    }

    main {
      width: min(100%, 380px);
      min-height: calc(100svh - 40px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
    }

    h1 {
      font-size: clamp(1.8rem, 8vw, 2.45rem);
      line-height: 1.05;
      font-weight: 750;
      letter-spacing: -0.055em;
      text-align: center;
    }

    .cards {
      display: grid;
      gap: 14px;
    }

    .card {
      min-height: 118px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.02)), var(--card);
      color: var(--text);
      text-decoration: none;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.32);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .card:active,
    .card:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.18);
    }

    @media (max-height: 560px) {
      main {
        gap: 16px;
      }

      .card {
        min-height: 92px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <main aria-label="RPAC Dashboard">
    <h1>RPAC Dashboard</h1>

    <nav class="cards" aria-label="Dashboard links">
      <a href="PAC1.html" class="card">PAC1</a>
      <a href="PAC2.html" class="card">PAC2</a>
    </nav>
  </main>
</body>
</html>
