<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Index</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Sora', sans-serif;
      padding: 40px 20px;
      gap: 20px;
    }

    h1 {
      color: rgba(255,255,255,0.15);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      max-width: 680px;
      width: 100%;
    }

    .tab {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .tab:hover {
      transform: translateY(-3px);
    }

    /* PAC1 — Blue */
    .tab-1 {
      background: linear-gradient(160deg, #080d1a 0%, #0d1628 60%, #1a2a50 100%);
      border: 1px solid rgba(74,127,232,0.35);
      color: #7baaf5;
      box-shadow: 0 0 18px rgba(74,127,232,0.25), inset 0 1px 0 rgba(74,127,232,0.15);
    }
    .tab-1:hover { box-shadow: 0 0 32px rgba(74,127,232,0.5), inset 0 1px 0 rgba(74,127,232,0.2); }

    /* PAC2 — Green */
    .tab-2 {
      background: linear-gradient(160deg, #060f0c 0%, #0a1a13 60%, #0f2a1e 100%);
      border: 1px solid rgba(61,184,122,0.35);
      color: #6dd4a4;
      box-shadow: 0 0 18px rgba(61,184,122,0.25), inset 0 1px 0 rgba(61,184,122,0.15);
    }
    .tab-2:hover { box-shadow: 0 0 32px rgba(61,184,122,0.5), inset 0 1px 0 rgba(61,184,122,0.2); }

    /* PAC3 — Violet */

      background: linear-gradient(160deg, #0d0814 0%, #160d28 60%, #261545 100%);

      color: #c09af7;
      box-shadow: 0 0 18px rgba(148,90,232,0.25), inset 0 1px 0 rgba(148,90,232,0.15);
    }
    .tab-3:hover { box-shadow: 0 0 32px rgba(148,90,232,0.5), inset 0 1px 0 rgba(148,90,232,0.2); }

    /* PAC4 — Amber */

      border: 1px solid rgba(232,168,50,0.35);
      color: #f5c96a;
      box-shadow: 0 0 18px rgba(232,168,50,0.25), inset 0 1px 0 rgba(232,168,50,0.15);

    .tab-4:hover { box-shadow: 0 0 32px rgba(232,168,50,0.5), inset 0 1px 0 rgba(232,168,50,0.2); }

  </style>
</head>
